name: Windows exe

# Builds DXFsmart.exe on every push to main and publishes it as the GitHub
# Release "v<VERSION>" (VERSION is read from run.py). Bump VERSION in run.py
# for a new release; pushing without a bump refreshes the same release.
on:
  push:
    branches: [main]
    paths-ignore: ["**.md"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: ver
        shell: pwsh
        run: |
          $v = (Select-String -Path run.py -Pattern '^VERSION = "(.+)"').Matches[0].Groups[1].Value
          "version=$v" >> $env:GITHUB_OUTPUT

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: python -m pip install -r requirements.txt pyinstaller pytest httpx

      - name: Test
        run: python -m pytest -q tests

      - name: Build exe
        run: >
          pyinstaller --noconfirm --onefile --name DXFsmart
          --add-data "static;static"
          --collect-submodules uvicorn
          --collect-submodules ezdxf
          --hidden-import scipy.signal
          run.py

      - name: Smoke test exe
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\DXFsmart.exe -PassThru -RedirectStandardOutput out.txt
          $ok = $false
          for ($i = 0; $i -lt 60; $i++) {
            try { $r = Invoke-RestMethod http://127.0.0.1:8000/api/health; if ($r.status -eq "ok") { $ok = $true; break } } catch {}
            Start-Sleep -Seconds 1
          }
          Stop-Process -Id $p.Id -Force
          if (-not $ok) { Get-Content out.txt; throw "exe did not start" }

      - uses: actions/upload-artifact@v4
        with:
          name: DXFsmart-windows
          path: dist/DXFsmart.exe

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: DXFsmart ${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: dist/DXFsmart.exe
          body: |
            **İndir ve çalıştır:** aşağıdaki `DXFsmart.exe` dosyasını indirip çift tıklayın. Python kurmanıza gerek yok.
            İlk açılışta Windows "bilgisayarınızı korudu" uyarısı verebilir: **Ek bilgi → Yine de çalıştır**.
            Program bu bilgisayarda çalışır; DXF dosyalarınız internete yüklenmez.

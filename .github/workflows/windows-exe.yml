name: Windows exe

# Builds DXFsmart.exe on every push to main and publishes it as the GitHub
# Release "v<VERSION>" (VERSION is read from version.py). Bump VERSION in version.py
# for a new release; pushing without a bump refreshes the same release.
on:
  push:
    branches: [main]
    paths-ignore: ["**.md"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: ver
        shell: pwsh
        run: |
          $v = (Select-String -Path version.py -Pattern '^VERSION = "(.+)"').Matches[0].Groups[1].Value
          "version=$v" >> $env:GITHUB_OUTPUT

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: python -m pip install -r requirements.txt pyinstaller pytest httpx

      - name: Rust toolchain
        run: rustup update stable --no-self-update && rustup default stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: third_party/sparrow

      - name: Build sparrow optimiser
        shell: pwsh
        run: |
          cd third_party/sparrow
          cargo build --release --features=live_svg --bin sparrow
          New-Item -ItemType Directory -Force ../../bin | Out-Null
          Copy-Item target/release/sparrow.exe ../../bin/sparrow.exe

      - name: Test
        shell: pwsh
        run: |
          python -m pytest -q tests --junitxml=report.xml
          $code = $LASTEXITCODE
          python -c "import xml.etree.ElementTree as E;r=E.parse('report.xml').getroot();[print('::error title='+c.get('classname','')+'.'+c.get('name','')+'::'+((f.get('message') or f.text or '')[:600]).replace(chr(10),' | ')) for c in r.iter('testcase') for f in list(c.findall('failure'))+list(c.findall('error'))]"
          exit $code

      - name: Build exe
        run: >
          pyinstaller --noconfirm --onefile --windowed --name DXFsmart
          --icon assets/dxfsmart.ico
          --add-data "static;static"
          --add-binary "bin/sparrow.exe;."
          --collect-submodules uvicorn
          --collect-submodules ezdxf
          --collect-submodules webview
          --hidden-import scipy.signal
          run.py

      - name: Smoke test exe
        shell: pwsh
        run: |
          $env:DXFSMART_HEADLESS = "1"
          $p = Start-Process -FilePath dist\DXFsmart.exe -PassThru
          $ok = $false
          for ($i = 0; $i -lt 60; $i++) {
            try { $r = Invoke-RestMethod http://127.0.0.1:8000/api/health; if ($r.status -eq "ok") { $ok = $true; break } } catch {}
            Start-Sleep -Seconds 1
          }
          Stop-Process -Id $p.Id -Force
          if (-not $ok) { Get-Content "$env:LOCALAPPDATA\DXFsmart\log.txt" -ErrorAction SilentlyContinue; throw "exe did not start" }

      - uses: actions/upload-artifact@v4
        with:
          name: DXFsmart-windows
          path: dist/DXFsmart.exe

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: DXFsmart ${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: dist/DXFsmart.exe
          body: |
            **İndir ve çalıştır:** aşağıdaki `DXFsmart.exe` dosyasını indirip çift tıklayın. Python kurmanıza gerek yok; program kendi penceresinde açılır.
            Bu sürümden sonra yeni sürümler program içinden tek tıkla güncellenir.
            İlk açılışta Windows "bilgisayarınızı korudu" uyarısı verebilir: **Ek bilgi → Yine de çalıştır**.
            Program bu bilgisayarda çalışır; DXF dosyalarınız internete yüklenmez.

            Yerleşim optimizasyonu [sparrow](https://github.com/JeroenGar/sparrow) (MIT) ve [jagua-rs](https://github.com/JeroenGar/jagua-rs) (MPL-2.0) kullanır; değiştirilmiş kaynak kodu `third_party/sparrow` klasöründedir.
